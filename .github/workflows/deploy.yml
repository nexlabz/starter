# Deploys with the Vercel CLI, so the Vercel project never needs a Git connection.
# Needs repo secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Without them (a fresh fork or template copy) the job skips instead of failing.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - id: gate
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Vercel secrets not set, skipping deploy. See docs/DEPLOYING.md."
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
      # Builds on Vercel, not here: `vercel pull` returns Sensitive env vars blank,
      # so a local `vercel build` fails env validation.
      - if: steps.gate.outputs.ready == 'true'
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" --env COMMIT_SHA="$GITHUB_SHA"
